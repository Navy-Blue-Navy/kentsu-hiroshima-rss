name: Update RSS

on:
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *"

permissions:
  contents: write

jobs:
  update-rss:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install requests
        run: pip install requests

      - name: Generate RSS
        run: |
          mkdir -p ~/Desktop
          python kentsu_rss.py
          cp ~/Desktop/kentsu_hiroshima.xml .

      - name: Commit updated RSS
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add kentsu_hiroshima.xml
          git diff --cached --quiet || git commit -m "Update RSS"
          git push
